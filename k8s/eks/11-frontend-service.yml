# ClusterIP, not NodePort — Gateway API + Envoy Gateway (12-gateway-api.yml)
# handles external routing to this Service on EKS.
kind: Service
apiVersion: v1
metadata:
  name: frontend-service
  namespace: devboard

spec:
  selector:
    app: devboard-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 4173 # container port
  type: ClusterIP
